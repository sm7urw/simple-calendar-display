<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Display Settings</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121212; 
            color: #e0e0e0; 
            max-width: 500px; 
            margin: 40px auto; 
            padding: 20px; 
        }
        h1 { border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 24px; color: #fff; }
        .form-group { margin-bottom: 24px; }
        .row { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .slider-wrap { flex-grow: 1; }
        label { display: block; margin-bottom: 8px; font-weight: 500; }
        input[type="range"] { width: 100%; margin-top: 4px; }
        input[type="color"] { 
            border: none; width: 40px; height: 40px; border-radius: 50%; 
            cursor: pointer; background: none; padding: 0;
        }
        .value-display { font-size: 0.9em; color: #007bff; font-weight: bold; margin-left: 5px; }
        button { 
            background: #007bff; color: white; border: none; padding: 12px 15px; 
            border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold;
        }
        button:hover { background: #0056b3; }
        .alert { background: #1e4620; color: #4ed164; border: 1px solid #2e7d32; padding: 12px; border-radius: 6px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Display Settings</h1>
    
    {% if success %}
        <div class="alert">✓ Settings saved successfully! Refresh your calendar screen.</div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label>Main Title</label>
            <div class="row">
                <div class="slider-wrap">
                    Size: <span class="value-display" id="title_val">{{ config.title_size }}px</span>
                    <input type="range" id="title_size" name="title_size" min="16" max="80" value="{{ config.title_size }}" oninput="document.getElementById('title_val').innerText = this.value + 'px'">
                </div>
                <input type="color" name="title_color" value="{{ config.title_color or '#ffffff' }}" title="Choose color">
            </div>
        </div>

        <div class="form-group">
            <label>Clock</label>
            <div class="row">
                <div class="slider-wrap">
                    Size: <span class="value-display" id="clock_val">{{ config.clock_size }}px</span>
                    <input type="range" id="clock_size" name="clock_size" min="24" max="140" value="{{ config.clock_size }}" oninput="document.getElementById('clock_val').innerText = this.value + 'px'">
                </div>
                <input type="color" name="clock_color" value="{{ config.clock_color or '#ffffff' }}" title="Choose color">
            </div>
        </div>

        <div class="form-group">
            <label>Event Title</label>
            <div class="row">
                <div class="slider-wrap">
                    Size: <span class="value-display" id="event_title_val">{{ config.event_title_size }}px</span>
                    <input type="range" id="event_title_size" name="event_title_size" min="14" max="50" value="{{ config.event_title_size }}" oninput="document.getElementById('event_title_val').innerText = this.value + 'px'">
                </div>
                <input type="color" name="event_title_color" value="{{ config.event_title_color or '#ffffff' }}" title="Choose color">
            </div>
        </div>

        <div class="form-group">
            <label>Event Description & Time</label>
            <div class="row">
                <div class="slider-wrap">
                    Size: <span class="value-display" id="event_desc_val">{{ config.event_desc_size }}px</span>
                    <input type="range" id="event_desc_size" name="event_desc_size" min="10" max="40" value="{{ config.event_desc_size }}" oninput="document.getElementById('event_desc_val').innerText = this.value + 'px'">
                </div>
                <input type="color" name="event_desc_color" value="{{ config.event_desc_color or '#ffffff' }}" title="Choose color">
            </div>
        </div>

        <button type="submit">Save Changes</button>
    </form>
</body>
</html>
